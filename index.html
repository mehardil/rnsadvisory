<html lang="en" dir="ltr">

    <meta charset="UTF-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />


    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong surface.
      try {
        var saved = JSON.parse(localStorage.getItem('rns-ui') || '{}')
        var theme = (saved.state && saved.state.theme) || 'light'
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
