server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  charset utf-8;
  client_max_body_size 10m;

  # Compression keeps the JS bundle and generated imagery snappy.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml
    font/woff
    font/woff2;

  # Hashed build assets never change — cache them aggressively.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Generated photography can be cached, but the manifest must be revalidated
  # so newly generated images are picked up immediately.
  location = /generated/manifest.json {
    add_header Cache-Control "no-cache";
  }

  location /generated/ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
  }

  # The HTML shell must always be revalidated so new deploys are visible.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Client-side routes fall back to the SPA shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
